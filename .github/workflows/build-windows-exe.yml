name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install akshare pandas openpyxl pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --collect-all akshare --collect-all py_mini_racer --collect-all openpyxl fetch_all_data.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-EXE
        path: dist/fetch_all_data.exe
